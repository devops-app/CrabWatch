name: iOS App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Login email (defaults to REVIEW_EMAIL secret)'
        required: false
      password:
        description: 'Login password (defaults to REVIEW_PASSWORD secret)'
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "10.33.2"
  SIM_NAME: "iPhone 16"
  BUNDLE_ID: "com.dsigncodehub.crabwatch"

jobs:
  screenshots:
    # macos-15 ships Xcode 16.x — required by React Native 0.81.6 (macos-14 only has Xcode 15.4)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter=@crabwatch/shared build

      - name: Create simulator
        run: |
          xcrun simctl list devices available | grep "iPhone 16" || \
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ env.SIM_NAME }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ env.SIM_NAME }}" -b

      - name: Build & launch app in simulator (background)
        run: |
          cd mobile
          nohup npx expo run:ios --device "${{ env.SIM_NAME }}" > /tmp/expo-build.log 2>&1 &
          echo $! > /tmp/expo-build.pid
          echo "Build started, PID $(cat /tmp/expo-build.pid)"

      - name: Wait for app to install in simulator
        run: |
          for i in $(seq 1 150); do
            if xcrun simctl listapps "${{ env.SIM_NAME }}" 2>/dev/null | grep -q "${{ env.BUNDLE_ID }}"; then
              echo "App installed after ~$((i * 10))s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/expo-build.pid)" 2>/dev/null; then
              echo "::error::expo build process exited early"
              tail -n 60 /tmp/expo-build.log
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for app install"
          tail -n 60 /tmp/expo-build.log
          exit 1

      - name: Wait for app to settle
        run: sleep 20

      - name: Install Appium + XCUITest driver
        working-directory: .github/scripts
        run: |
          npm install
          # Pin driver to v10 — the last major compatible with Appium 2 (v11+ requires Appium 3)
          npx appium driver install appium-xcuitest-driver@10

      - name: Capture screenshots
        working-directory: .github/scripts
        env:
          REVIEW_EMAIL: ${{ github.event.inputs.email || secrets.REVIEW_EMAIL }}
          REVIEW_PASSWORD: ${{ github.event.inputs.password || secrets.REVIEW_PASSWORD }}
        run: |
          node ios-screenshots.mjs

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots
          path: images/screenshots/store/
          if-no-files-found: error

      - name: Stop build process
        if: always()
        run: |
          kill "$(cat /tmp/expo-build.pid)" 2>/dev/null || true
          tail -n 20 /tmp/expo-build.log || true
