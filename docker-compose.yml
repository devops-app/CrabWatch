services:
  postgres:
    image: postgres:16-alpine
    container_name: crabwatch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crabwatch_dev_password
      POSTGRES_DB: crabwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
